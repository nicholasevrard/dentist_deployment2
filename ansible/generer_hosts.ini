---
- name: Générer le fichier hosts.ini à partir de all_public_dns.txt
  hosts: localhost
  gather_facts: no

  vars:
    dns_file: "../Terraform/all_public_dns.txt"
    output_file: "./hosts.ini"
    private_key_path: "../Terraform/my-key"

  tasks:
    - name: Lire le contenu du fichier all_public_dns.txt
      slurp:
        src: "{{ dns_file }}"
      register: dns_data

    - name: Convertir le contenu en texte brut
      set_fact:
        dns_lines: "{{ dns_data.content | b64decode | splitlines() }}"

    - name: Extraire les paires (nom, DNS)
      set_fact:
        dns_dict: >-
          {{
            dns_lines | map('split', ' = ') |
            map('map', 'trim') |
            items2dict
          }}

    - name: Générer le fichier hosts.ini
      copy:
        dest: "{{ output_file }}"
        content: |
          [aws_cicdcd_instance]
          ubuntu@{{ dns_dict.cicdcd_public_dns }} ansible_ssh_private_key_file={{ private_key_path }}

          [aws_test_instance]
          ubuntu@{{ dns_dict.test_public_dns }} ansible_ssh_private_key_file={{ private_key_path }}

          [aws_production_instance]
          ubuntu@{{ dns_dict.production_public_dns }} ansible_ssh_private_key_file={{ private_key_path }}

          [aws_monitoring_instance]
          ubuntu@{{ dns_dict.monitoring_public_dns }} ansible_ssh_private_key_file={{ private_key_path }}
